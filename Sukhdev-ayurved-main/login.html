<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#FAF8F3">
  <title>Login | Sukhdev</title>

  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="dash.css">

  <style>
    .hide { display: none !important; }

    .split { display: grid; grid-template-columns: 1fr 1fr; min-height: 100vh; min-height: 100dvh; }

    /* ---------- Left image ---------- */
    .art {
      position: relative; min-height: 100vh; min-height: 100dvh;
      background: #a3ab93 url('image/joanna-stolowicz-QdX9Ds-WrCQ-unsplash.jpg') center/cover no-repeat;
      overflow: hidden;
    }
    .art::before {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(20,37,25,.25), rgba(20,37,25,.72));
    }
    .cap {
      position: relative; z-index: 1; color: #fff; height: 100%; min-height: 100vh; min-height: 100dvh;
      padding: 48px; display: flex; flex-direction: column; justify-content: space-between;
    }
    .cap .mark { color: #fff; font-size: 1.3rem; letter-spacing: 2px; text-decoration: none; }
    .cap h2 { color: #fff; font-size: clamp(2.2rem, 4vw, 3.5rem); line-height: 1.15; max-width: 480px; }
    .cap p { opacity: .85; margin-top: 14px; font-size: .95rem; }

    /* ---------- Right form ---------- */
    .form { display: grid; place-items: center; padding: 40px 24px; background: #FAF8F3; }
    .box { width: 100%; max-width: 400px; transition: opacity .25s ease; }
    .box.checking { opacity: 0; pointer-events: none; }

    .mobile-brand {
      display: none; font-family: 'Playfair Display', serif; font-size: 1.15rem;
      letter-spacing: 3px; color: var(--g, #2f4a35); text-decoration: none; margin-bottom: 28px;
    }

    .box h1 { font-size: 2rem; margin-bottom: 6px; }
    .box > p.lead { color: var(--mu, #777); font-size: .9rem; line-height: 1.5; margin-bottom: 24px; }

    /* Google button (top) */
    .gbtn {
      width: 100%; min-height: 48px; display: flex; align-items: center; justify-content: center; gap: 10px;
      background: #fff; border: 1px solid var(--ln, #ddd); border-radius: 6px; color: #333;
      font-size: .88rem; font-weight: 700; cursor: pointer; transition: border-color .2s, box-shadow .2s;
    }
    .gbtn:hover:not(:disabled) { border-color: var(--g, #2f4a35); box-shadow: 0 2px 10px rgba(0,0,0,.06); }

    .or {
      display: flex; align-items: center; gap: 12px; margin: 22px 0;
      color: var(--mu, #777); font-size: .7rem; letter-spacing: 1.5px; text-transform: uppercase;
    }
    .or::before, .or::after { content: ''; flex: 1; height: 1px; background: var(--ln, #ddd); }

    /* Tabs (segmented) */
    .tabs {
      display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; margin-bottom: 24px;
      background: rgba(0,0,0,.05); border-radius: 8px;
    }
    .tabs button {
      padding: 11px 8px; font-size: .72rem; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase;
      color: var(--mu, #777); border: 0; border-radius: 6px; background: transparent; cursor: pointer;
      transition: background .2s, color .2s, box-shadow .2s; margin: 0;
    }
    .tabs button.on { background: #fff; color: var(--g, #2f4a35); box-shadow: 0 1px 4px rgba(0,0,0,.1); }
    .tabs button:focus-visible { outline: 2px solid var(--g, #2f4a35); outline-offset: 2px; }

    /* Fields */
    .form-fields { animation: appear .25s ease; }
    @keyframes appear { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

    .field { margin-bottom: 18px; }
    .field .row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 7px; }
    .field label {
      display: block; margin: 0; font-size: .72rem; font-weight: 700; letter-spacing: 1px;
      text-transform: uppercase; color: #444;
    }
    .field input {
      width: 100%; margin: 0; min-height: 48px; padding: 0 14px; font-size: 1rem; font-family: inherit;
      background: #fff; border: 1px solid var(--ln, #ddd); border-radius: 6px; color: #222;
      transition: border-color .2s, box-shadow .2s;
    }
    .field input:focus { outline: none; border-color: var(--g, #2f4a35); box-shadow: 0 0 0 3px rgba(47,74,53,.14); }
    .field input.bad { border-color: #b8433f; box-shadow: 0 0 0 3px rgba(184,67,63,.12); }
    .field small { display: block; margin-top: 6px; font-size: .74rem; color: var(--mu, #777); }

    .pw { position: relative; }
    .pw input { padding-right: 48px; }
    .eye {
      position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
      width: 40px; height: 40px; display: grid; place-items: center;
      background: none; border: 0; cursor: pointer; color: var(--mu, #777); border-radius: 6px;
    }
    .eye:hover { color: var(--g, #2f4a35); }
    .eye:focus-visible { outline: 2px solid var(--g, #2f4a35); }

    .linkbtn {
      background: none; border: 0; padding: 0; cursor: pointer; font-family: inherit;
      font-size: .76rem; color: var(--g, #2f4a35); text-decoration: underline; text-underline-offset: 3px;
    }

    /* Primary button */
    .box .btn {
      width: 100%; min-height: 48px; display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    }
    button:disabled { opacity: .65; cursor: not-allowed; }
    .spin {
      width: 16px; height: 16px; border-radius: 50%; border: 2px solid rgba(255,255,255,.4);
      border-top-color: #fff; animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Messages (right under the form) */
    .msg { margin-top: 14px; padding: 0; font-size: .84rem; line-height: 1.5; border-radius: 6px; }
    .msg.err, .msg.success { padding: 11px 14px; }
    .msg.err { background: #fbe4e3; color: #9c2f2b; border-left: 3px solid #b8433f; }
    .msg.success { background: #e1f3e4; color: #1f6b38; border-left: 3px solid #267044; }

    .back { display: inline-block; margin-top: 26px; font-size: .8rem; color: var(--mu, #777); text-decoration: none; transition: color .2s; }
    .back:hover { color: var(--g, #2f4a35); }

    /* ---------- Responsive ---------- */
    @media (max-width: 800px) {
      .split { grid-template-columns: 1fr; }
      .art { display: none; }
      .form { min-height: 100vh; min-height: 100dvh; align-items: start; padding: 32px 22px 40px; }
      .box { max-width: 440px; margin: 0 auto; }
      .mobile-brand { display: inline-block; }
    }
    @media (max-width: 420px) {
      .box h1 { font-size: 1.75rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>

<body>

  <div class="split">

    <!-- LEFT IMAGE SECTION -->
    <section class="art">
      <div class="cap">
        <a href="index.html" class="mark">SUKHDEV</a>
        <div>
          <h2>Nature's purity<br>in every sip.</h2>
          <p>Handcrafted Ayurvedic teas, delivered to your door.</p>
        </div>
      </div>
    </section>

    <!-- RIGHT LOGIN SECTION -->
    <main class="form">
      <div class="box checking" id="box">

        <a href="index.html" class="mobile-brand">SUKHDEV</a>

        <h1 id="h">Welcome back</h1>
        <p class="lead" id="sub">Sign in to track your orders and check out faster.</p>

        <!-- GOOGLE -->
        <button type="button" class="gbtn" id="googleBtn">
          <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
            <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.6 5.9c4.5-4.1 7-10.2 7-17.6z"/>
            <path fill="#FBBC05" d="M10.5 28.7c-.5-1.4-.8-3-.8-4.7s.3-3.2.8-4.7l-7.9-6.1C.9 16.4 0 20.1 0 24s.9 7.6 2.6 10.8l7.9-6.1z"/>
            <path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.6-5.9c-2.1 1.4-4.9 2.3-8.3 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/>
          </svg>
          Continue with Google
        </button>

        <div class="or">or use email</div>

        <!-- TABS -->
        <div class="tabs" role="tablist">
          <button type="button" class="on" id="t1" role="tab" aria-selected="true" aria-controls="fl">Sign in</button>
          <button type="button" id="t2" role="tab" aria-selected="false" aria-controls="fr">Create account</button>
        </div>

        <!-- LOGIN FORM -->
        <form id="fl" class="form-fields" novalidate role="tabpanel" aria-labelledby="t1">
          <div class="field">
            <div class="row"><label for="le">Email address</label></div>
            <input id="le" type="email" placeholder="you@example.com" autocomplete="username" inputmode="email" autocapitalize="off" spellcheck="false" required>
          </div>

          <div class="field">
            <div class="row">
              <label for="lp">Password</label>
              <button type="button" class="linkbtn" id="fp">Forgot password?</button>
            </div>
            <div class="pw">
              <input id="lp" type="password" placeholder="Enter your password" autocomplete="current-password" required>
              <button type="button" class="eye" data-eye="lp" aria-label="Show password"></button>
            </div>
          </div>

          <button class="btn primary" id="loginBtn" type="submit">Sign in</button>
        </form>

        <!-- REGISTER FORM -->
        <form id="fr" class="form-fields hide" novalidate role="tabpanel" aria-labelledby="t2">
          <div class="field">
            <div class="row"><label for="rn">Full name</label></div>
            <input id="rn" type="text" placeholder="Your full name" autocomplete="name" required>
          </div>

          <div class="field">
            <div class="row"><label for="re">Email address</label></div>
            <input id="re" type="email" placeholder="you@example.com" autocomplete="email" inputmode="email" autocapitalize="off" spellcheck="false" required>
          </div>

          <div class="field">
            <div class="row"><label for="rp">Phone number</label></div>
            <input id="rp" type="tel" placeholder="10-digit mobile number" autocomplete="tel" inputmode="tel" required>
          </div>

          <div class="field">
            <div class="row"><label for="rw">Password</label></div>
            <div class="pw">
              <input id="rw" type="password" placeholder="Minimum 6 characters" autocomplete="new-password" minlength="6" required>
              <button type="button" class="eye" data-eye="rw" aria-label="Show password"></button>
            </div>
            <small>Use at least 6 characters.</small>
          </div>

          <button class="btn primary" id="registerBtn" type="submit">Create account</button>
        </form>

        <!-- MESSAGES -->
        <div class="msg" id="err" role="alert" aria-live="polite"></div>

        <a href="index.html" class="back">← Back to website</a>

      </div>
    </main>

  </div>

<script src="store.js"></script>
<script src="store-ext.js"></script>
<script src="cart-system.js"></script>
<script src="script.js"></script>

<script type="module">
  import { SDAuth } from './firebase.js';

  const $ = id => document.getElementById(id);

  if (typeof Store === 'undefined') {
    $('box').classList.remove('checking');
    $('err').textContent = 'Unable to load the store. Please check your store.js file.';
    $('err').className = 'msg err';
    ['loginBtn', 'registerBtn', 'googleBtn'].forEach(i => $(i).disabled = true);
    throw new Error('Store missing');
  }

  // Only allow local relative redirect destinations.
  const requestedNext = new URLSearchParams(location.search).get('next');
  const next = (
    requestedNext &&
    !requestedNext.startsWith('//') &&
    !requestedNext.includes('\\') &&
    !/^[a-z][a-z0-9+.-]*:/i.test(requestedNext) &&
    !requestedNext.startsWith('/') &&
    !requestedNext.startsWith('#')
  ) ? requestedNext : 'account.html';

  let attempts = 0, lockUntil = 0, busy = false, redirected = false, revealed = false;

  /* ---------- UI helpers ---------- */
  const EYE_ON  = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>';
  const EYE_OFF = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.9 17.9A10.9 10.9 0 0 1 12 19c-6.4 0-10-7-10-7a18.5 18.5 0 0 1 5.1-5.9M9.9 5.2A10 10 0 0 1 12 5c6.4 0 10 7 10 7a18.6 18.6 0 0 1-2.2 3.2M1 1l22 22"/><path d="M14.1 14.1a3 3 0 1 1-4.2-4.2"/></svg>';

  document.querySelectorAll('[data-eye]').forEach(btn => {
    btn.innerHTML = EYE_ON;
    btn.addEventListener('click', () => {
      const input = $(btn.dataset.eye);
      const show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      btn.innerHTML = show ? EYE_OFF : EYE_ON;
      btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
      input.focus();
    });
  });

  const show = (message, ok = false) => {
    const el = $('err');
    el.textContent = message;
    el.className = message ? (ok ? 'msg success' : 'msg err') : 'msg';
  };
  const clearMsg = () => {
    show('');
    document.querySelectorAll('.field input.bad').forEach(i => i.classList.remove('bad'));
  };
  const fail = (message, inputId) => {
    show(message);
    if (inputId) { const el = $(inputId); el.classList.add('bad'); el.focus(); }
  };

  const labels = { loginBtn: 'Sign in', registerBtn: 'Create account' };
  const loadingText = { loginBtn: 'Signing in…', registerBtn: 'Creating account…' };

  const setBusy = (b, btnId) => {
    busy = b;
    ['loginBtn', 'registerBtn', 'googleBtn'].forEach(i => $(i).disabled = b);
    ['loginBtn', 'registerBtn'].forEach(i => {
      $(i).innerHTML = (b && i === btnId)
        ? '<span class="spin"></span>' + loadingText[i]
        : labels[i];
    });
  };

  // Clear the red highlight as soon as the user edits a field
  document.addEventListener('input', e => {
    if (e.target.classList && e.target.classList.contains('bad')) e.target.classList.remove('bad');
  });

  // Reveal the form (once Firebase has told us whether someone is signed in)
  function reveal() {
    if (revealed) return;
    revealed = true;
    $('box').classList.remove('checking');
    if (window.matchMedia('(min-width: 801px)').matches) {
      const target = $('fl').classList.contains('hide') ? $('rn') : $('le');
      target.focus({ preventScroll: true });
    }
  }
  setTimeout(reveal, 2500); // safety net if auth is slow

  /* ---------- Auth flow ---------- */
  const OWNER = SDAuth.OWNER_EMAIL.toLowerCase();

  async function finish(user, justRegistered = false) {
    const isOwner = (user.email || '').toLowerCase() === OWNER;

    // Owner must verify email before admin access is granted
    if (isOwner && !user.emailVerified) {
      if (!justRegistered) { try { await SDAuth.resendVerification(); } catch (e) {} }
      await SDAuth.logout();
      show('We sent a verification email to ' + user.email + '. Verify it, then sign in again to open the admin panel.', true);
      return;
    }

    redirected = true;
    location.replace(SDAuth.roleOf(user) ? 'admin.html' : next);
  }

  // Already signed in? Skip the form.
  SDAuth.onChange(user => {
    if (user && !busy && !redirected) {
      redirected = true;
      location.replace(SDAuth.roleOf(user) ? 'admin.html' : next);
      return;
    }
    if (!user) reveal();
  });

  /* ---------- Tabs ---------- */
  function tab(login, focus = true) {
    $('fl').classList.toggle('hide', !login);
    $('fr').classList.toggle('hide', login);
    $('t1').classList.toggle('on', login);
    $('t2').classList.toggle('on', !login);
    $('t1').setAttribute('aria-selected', String(login));
    $('t2').setAttribute('aria-selected', String(!login));
    $('h').textContent = login ? 'Welcome back' : 'Join Sukhdev';
    $('sub').textContent = login
      ? 'Sign in to track your orders and check out faster.'
      : 'Create an account to order and track your teas.';
    clearMsg();
    if (focus) $(login ? 'le' : 'rn').focus();
  }
  $('t1').addEventListener('click', () => tab(true));
  $('t2').addEventListener('click', () => tab(false));
  if (location.hash === '#signup' || location.hash === '#register') tab(false, false);

  function failedLogin() {
    attempts++;
    if (attempts >= 5) { lockUntil = Date.now() + 30000; attempts = 0; }
  }

  /* ---------- LOGIN ---------- */
  $('fl').addEventListener('submit', async e => {
    e.preventDefault();
    clearMsg();

    if (Date.now() < lockUntil) {
      return show(`Too many attempts. Please wait ${Math.ceil((lockUntil - Date.now()) / 1000)} seconds.`);
    }

    const email = $('le').value.trim();
    const password = $('lp').value;
    if (!email) return fail('Please enter your email address.', 'le');
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return fail('Please enter a valid email address.', 'le');
    if (!password) return fail('Please enter your password.', 'lp');

    setBusy(true, 'loginBtn');
    try {
      const user = await SDAuth.login(email, password);
      attempts = 0;
      $('lp').value = '';
      await finish(user);
    } catch (err) {
      console.error('Login error:', err);
      failedLogin();
      const code = err && err.code;
      const field = (code === 'auth/invalid-credential' || code === 'auth/wrong-password') ? 'lp'
                  : (code === 'auth/invalid-email' || code === 'auth/user-not-found') ? 'le' : null;
      fail(SDAuth.errorMessage(err), field);
    } finally {
      if (!redirected) setBusy(false);
    }
  });

  /* ---------- REGISTER ---------- */
  $('fr').addEventListener('submit', async e => {
    e.preventDefault();
    clearMsg();

    const data = {
      name: $('rn').value.trim(),
      email: $('re').value.trim(),
      phone: $('rp').value.trim(),
      password: $('rw').value
    };

    if (!data.name) return fail('Please enter your full name.', 'rn');
    if (!data.email) return fail('Please enter your email address.', 're');
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(data.email)) return fail('Please enter a valid email address.', 're');
    if (!data.phone) return fail('Please enter your phone number.', 'rp');
    if (data.phone.replace(/\D/g, '').length < 10) return fail('Please enter a valid 10-digit phone number.', 'rp');
    if (!data.password) return fail('Please choose a password.', 'rw');
    if (data.password.length < 6) return fail('Password must be at least 6 characters.', 'rw');

    setBusy(true, 'registerBtn');
    try {
      const user = await SDAuth.register(data);
      await finish(user, true);
    } catch (err) {
      console.error('Registration error:', err);
      const code = err && err.code;
      const field = code === 'auth/email-already-in-use' || code === 'auth/invalid-email' ? 're'
                  : code === 'auth/weak-password' ? 'rw' : null;
      fail(SDAuth.errorMessage(err), field);
    } finally {
      if (!redirected) setBusy(false);
    }
  });

  /* ---------- GOOGLE ---------- */
  $('googleBtn').addEventListener('click', async () => {
    clearMsg();
    setBusy(true);
    try {
      const user = await SDAuth.google();
      await finish(user);
    } catch (err) {
      console.error('Google sign-in error:', err);
      show(SDAuth.errorMessage(err));
    } finally {
      if (!redirected) setBusy(false);
    }
  });

  /* ---------- FORGOT PASSWORD ---------- */
  $('fp').addEventListener('click', async () => {
    clearMsg();
    const email = $('le').value.trim();
    if (!email) return fail('Enter your email above first, then click "Forgot password?".', 'le');
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return fail('Please enter a valid email address.', 'le');
    try {
      await SDAuth.resetPassword(email);
      show('Password reset email sent to ' + email + '. Check your inbox (and spam folder).', true);
    } catch (err) {
      show(SDAuth.errorMessage(err));
    }
  });
</script>

</body>
</html>
